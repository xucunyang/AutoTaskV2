# 采集类任务的验收（三条采集线共用）：产物是 .md，且必须有可核验来源。
#
# 规则只查**可机械判定**的东西：文件在不在、有没有来源、来源够不够新够不够权威、
# 正文有没有实质内容。"数字对不对""结论站不站得住"没法机械判，
# 写进规则只会变成一堆永远为真、也永远抓不到问题的断言。
#
# path 用 {output} 而不是写死文件名：这份验收被 t1_tier / t2_xz_nj / t3_hexagon
# 三条任务共用，产物名各不相同（t1_tier.md / t2_xuzhou_nanjing.md /
# t3_hexagon_cities.md）。写死 artifacts/{date}/report.md 等于查了一个
# **没人声明要产出**的文件——实测 10-03：report.md 是其中一条任务顺手写的，
# 另外两条的 file_exists/bytes 因此一起"通过"，产物存在性互相顶替。
# {output} 在 expand_template 里替换成该任务自己的 outputs[0]。
- type: file_exists
  path: "{output}"

# 正文有实质内容。只查 file_exists 的话，模型写一句"数据获取失败"也算通过
# ——这种"通过了但没用"的验收最坏。
# 用 bytes 而不是 len(content)：h_business_rule 注入的变量只有
# bytes/rows/cols，content 并不存在，写 len(content) 会每次 NameError 判 FAIL。
# 一条永远红的验收比没有验收更糟（会被习惯性忽略）。
# 800 字节约合 400+ 汉字，足以排除"一句话交差"。
- type: business_rule
  expr: "bytes >= 800"
  path: "{output}"

# 幻觉拒收：每条论断必须挂到真实存在的来源上
- type: source_traceable

# 时效：来源超过 freshness_days 天的比例不能超过 30%
# 默认 180 → 365（2026-10-03 放宽）：金融街/东吴/克而瑞 H1 报告等半年/年度
# 数据天然落在窗口外，180 天把地产行业合理报告全毙了。
# 365 天仍卡住超 1 年的陈旧报告（不会让陈年市场分析蒙混过关）。
- type: freshness
  freshness_days: 365

# A 类（官方/权威机构/统计口径）来源要超过 20%
# 30% 实测不够：模型能找到的 gov.cn/stats.gov.cn 散落十几条来源里只有 3-5 条，
# 其余全是权威媒体（CCTV/新华/人民/证券时报/第一财经等）按 tier_criteria 划到 B。
# 20% = "至少每 5 条来源里有 1 条真官方"，比"过半"宽松但仍要求锚定官方数据。
# 阈值历史：0.5（V7定版）→ 0.3（2026-10-03 实跑不够）→ 0.20（2026-10-03 同日二次放宽）
- type: source_quality
  source_tier_min_ratio: {A: 0.2}

# 报告要有图（2026-10-04 加，次日生效）：这三份报告全是表格 + 长段文字，
# 数据都有、但没有一处曲线，"有没有图"原来没人管。这三条本身就有大量
# 可比数列（分能级涨跌 / 徐州 vs 南京 / 六边形三维），贴一张 xychart 即可。
# path 用 {output}：三条任务共用这份验收，各查各的产物。
# min:1 而不是多张——正文只要求"至少有一张图"，多画不加分也不扣分。
- type: mermaid
  path: "{output}"
  min: 1