# t1b_sku_ingest 的验收（全链共用，硬件链首发）。
#
# 这条任务本身是确定性脚本的触发器——验收的核心不是文风，而是
# **入库真的发生了**：stats 文件由 tools.sku_ingest 自己落盘
# （不经过模型转抄），行数门槛是设计 D6 的兜底（模型没跑命令 =
# stats 不存在或行数不足 = FAIL）。
- type: file_exists
  path: artifacts/{date}/t1b_ingest_stats.json

# 入库量门槛：ingested ≥ 5（ingested=ok+updated 由入库器预计算——
# 验收表达式沙箱禁止算术 BinOp，2026-10-11 t1b 恒红实测）。2026-10-11
# 实测校准：输入量已由上游 Schema minItems≥10 兜底，但冷启动期
# no_entity/bad_row 占比可观（13 行入 5 行——spec 不规范+待收编新
# 实体），≥10 会把正常冷启动轮次推进死信；入库质量由下一条看管。
- type: business_rule
  path: artifacts/{date}/t1b_ingest_stats.json
  expr: 'j_get(j, ["ingested"], 0) >= 5'

# 隔离区透明：隔离行超过入库行 = 采集质量出了问题，该被人看见
# 而不是静默通过（isolated=quarantined+no_entity 预计算；新 SKU 冷
# 启动期 no_entity 偏多是正常现象，收编闭环会消化它们）。
- type: business_rule
  path: artifacts/{date}/t1b_ingest_stats.json
  expr: 'j_get(j, ["isolated"], 0) <= j_get(j, ["ingested"], 0)'
