# hardware 汇总（t3_hw_report）验收：与 finance/ daily 的汇总任务同构。
#
# 刻意**不含** source_* 三条：这条 needs_web:false、不产生 sources.json，
# 加上去只会变成永远 FAIL（acceptance_rollup 的教训）。来源可信度在
# t1_gpu_ram / t2_hw_news 上已各自查过。
- type: file_exists
  path: artifacts/{date}/hardware_report.md

# 800 字节约合 400+ 汉字，排除"一句话交差"
- type: business_rule
  expr: "bytes >= 800"
  path: artifacts/{date}/hardware_report.md

- type: file_exists
  path: artifacts/{date}/hardware_summary.json

- type: json_schema
  path: artifacts/{date}/hardware_summary.json
  schema_ref: schemas/hardware_summary.schema.json

# 报告要有图：输入里的 t2_hw_news.md 本来就带 ≥1 张 mermaid，原样贴进来即可。
# 计数认 xychart/pie/gantt，且语法错的图不算数（verifier.lint_chart_block）。
- type: mermaid
  path: artifacts/{date}/hardware_report.md
  min: 1
