# hardware t4_hw_trend 的验收（trend 与推荐）。
#
# 锁死：t4 是 complex 任务读快照写报告，验收三道闸（v3.3 M4）：
# - python_test 从 DB 重算抽样指标与快照一致（防模型改数）
# - mermaid 闸：有显著变化实体必须配图；全库无显著变化时至少 1 张全局图
# - file_exists hw_trend.md + hw_recommend.json
- type: file_exists
  path: artifacts/{date}/hw_trend.md

- type: file_exists
  path: artifacts/{date}/hw_recommend.json

# python_test：从 DB 重算基底实体的 L0 指标与 trend_snapshot.json
# 逐字段比对（容差 0.01），不一致 exit 1——防模型微调数字。
# 脚本自扫最新快照（t4 验收跑在 t4 完成后，最新=当日）。
# cmd 无 {date} 展开（h_python_test 不做占位替换），所以脚本自己找日期。
# cwd=仓库根（h_python_test 固定），路径带 orchestrator/ 前缀。
- type: python_test
  cmd: "python -X utf8 orchestrator/tools/verify_snap.py"
  timeout_s: 120

# mermaid：模型必须画图。mermaid handler 默认 ≥1 张。当日全库无
# 显著变化时退化为全局汇总图（v3.3 §9.0 M4 修正）——这部分逻辑放
# t4 的 card 写明，验收只保门宽足以发现「一张图都没画」。
- type: mermaid
  path: artifacts/{date}/hw_trend.md
  min: 1

# hw_recommend.json 形状对照（j_get 校验字段齐备）。注意：表达式
# 沙箱无 len()（BUILTIN_FNS 只有 j_get）——「decisions 键存在」用
# in 判（In 节点在白名单），不写 len(...) >= 0（恒红，2026-10-11 排雷）。
- type: business_rule
  path: artifacts/{date}/hw_recommend.json
  expr: 'j_get(j, ["date"], "") != "" and "decisions" in j'