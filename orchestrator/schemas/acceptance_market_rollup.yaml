# 月度总体趋势（m_rollup）的验收。
#
# 与 acceptance_rollup.yaml 结构相同、只有产物路径不同（m_monthly_trend.md
# 而不是 t4_investment_watch.md），故单开一份而不去改 acceptance_rollup.yaml：
# 那份仍被 housing_daily 的 t4_rollup 使用，两个文件各自的 path 必须
# 指向**该任务声明过的 outputs**（tests/test_acceptance_refs.py::
# test_acceptance_paths_point_at_declared_outputs 会逐字核对）。
#
# 同样刻意不含 freshness / source_quality / source_traceable：
# m_rollup 是 needs_web:false 的纯汇总，不检索、不产 sources.json，
# 加上去只会变成永远 FAIL。

- type: file_exists
  path: artifacts/{date}/m_monthly_trend.md

- type: business_rule
  expr: "bytes >= 600"
  path: artifacts/{date}/m_monthly_trend.md

# 汇总报告要有图：输入里的 t1_tier.md 本来就带 ≥1 张 mermaid
# （acceptance_market_tier 的门禁），原样贴进对应小节即可。
- type: mermaid
  path: artifacts/{date}/m_monthly_trend.md
  min: 1