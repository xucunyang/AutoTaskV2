# finance 汇总（t3_finance_report）验收：与 daily 的 acceptance_t3 同构。
#
# 刻意**不含** source_traceable / freshness / source_quality：
# 这条 needs_web:false、不产生新的 sources.json，加上去只会变成永远 FAIL
# （acceptance_rollup 里写过这个教训——一条永远红的验收等于没有验收）。
# 来源可信度在 t1_stocks / t2_investment 上已各自查过一遍。
#
# json_schema 是硬闸：摘要形状不对 = schema_violation。summary.schema 那次的
# 教训是"卡上没有形状"时模型把 rows 写成城市明细数组——现在形状经
# _schema_hint 内联进任务卡，字段含义也写在 description 里。
- type: file_exists
  path: artifacts/{date}/finance_report.md

# 800 字节约合 400+ 汉字，排除"一句话交差"
- type: business_rule
  expr: "bytes >= 800"
  path: artifacts/{date}/finance_report.md

- type: file_exists
  path: artifacts/{date}/finance_summary.json

- type: json_schema
  path: artifacts/{date}/finance_summary.json
  schema_ref: schemas/finance_summary.schema.json

# 报告要有图：输入里的 t2_investment.md 本来就带 ≥1 张 mermaid，原样贴进来即可。
# 计数认 xychart/pie/gantt，且语法错的图不算数（verifier.lint_chart_block）。
- type: mermaid
  path: artifacts/{date}/finance_report.md
  min: 1

# data_period 逐市场与 t1_stocks.csv 的交易日列机械比对。
# 2026-10-09/10 事故：这里曾写死下限（美股 ≥10-05 / A股 ≥09-30 / 港股 ≥09-29）
# ——静态日期过了当周就永远放行，管不住「标签错」。更早模板还给过示例日期
# （A 股=9-30 节前），模型照抄示例，CSV 交易日列明明是 10-09、summary 却标
# 09-30，用户看标签以为数据是节前的，两天不敢信报告。数字对、标签错也是错：
# data_period.{市场} 必须逐字等于 CSV 中该市场行的交易日列。
- type: data_period_match
