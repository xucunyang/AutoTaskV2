<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报告中心 · AutoTaskV2</title>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/mermaid.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --line: #e3e8ef; --sub: #7a8699;
    --text: #1f2d3d; --accent: #2f6fed; --accent-soft: #eef3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.65 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; height: 100vh;
  }
  aside {
    width: 260px; flex: none; overflow-y: auto; background: var(--card);
    border-right: 1px solid var(--line); padding: 10px 0 30px;
  }
  aside h1 {
    font-size: 15px; margin: 8px 16px 2px; color: var(--text);
  }
  aside .tip { margin: 0 16px 10px; color: var(--sub); font-size: 12px; }
  aside .date {
    padding: 7px 16px; cursor: pointer; display: flex;
    justify-content: space-between; gap: 6px; user-select: none;
  }
  aside .date:hover { background: var(--accent-soft); }
  aside .date.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  aside .date .n { color: var(--sub); font-size: 12px; font-weight: 400; }
  aside .files { padding: 2px 0 8px; }
  aside .files a {
    display: block; padding: 5px 16px 5px 30px; color: var(--text);
    text-decoration: none; font-size: 13px; border-left: 3px solid transparent;
  }
  aside .files a:hover { background: var(--accent-soft); }
  aside .files a.on { border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 28px 36px 80px; }
  .paper {
    max-width: 980px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 30px 40px 50px;
  }
  .paper h1 { font-size: 22px; border-bottom: 2px solid var(--line); padding-bottom: 10px; }
  .paper h2 { font-size: 18px; margin-top: 30px; }
  .paper h3 { font-size: 15px; }
  .paper table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  .paper th, .paper td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .paper th { background: var(--accent-soft); }
  .paper code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .paper pre { background: #f1f3f6; border: 1px solid var(--line); border-radius: 8px;
               padding: 12px 14px; overflow-x: auto; }
  .paper pre code { background: none; padding: 0; }
  .paper blockquote { border-left: 3px solid var(--line); margin: 10px 0; padding: 2px 14px; color: var(--sub); }
  .mermaid { text-align: center; margin: 14px 0; overflow-x: auto; }
  #empty { color: var(--sub); text-align: center; margin-top: 120px; }
</style>
</head>
<body>
<aside>
  <h1>报告中心</h1>
  <div class="tip">artifacts 每日产物 · 按日期归档</div>
  <div id="list">加载中…</div>
</aside>
<main><div class="paper" id="view"><div id="empty">← 选一份报告</div></div></main>
<script>
const $ = s => document.querySelector(s);
let curDate = null, curFile = null;

async function loadList() {
  const d = await (await fetch('/api/reports?days=30')).json();
  const box = $('#list');
  box.innerHTML = '';
  if (!(d.days || []).length) { box.textContent = 'artifacts 下暂无报告'; return; }
  for (const day of d.days) {
    const div = document.createElement('div');
    div.className = 'date';
    div.innerHTML = `<span>${day.date}</span><span class="n">${day.files.length}</span>`;
    const files = document.createElement('div');
    files.className = 'files';
    files.style.display = 'none';
    for (const f of day.files) {
      const a = document.createElement('a');
      a.href = '#'; a.textContent = f.label;
      a.title = `${f.name} · ${f.mtime}`;
      a.onclick = ev => { ev.preventDefault(); openReport(day.date, f, a); };
      files.appendChild(a);
    }
    div.onclick = () => {
      const open = files.style.display !== 'none';
      files.style.display = open ? 'none' : 'block';
    };
    box.appendChild(div); box.appendChild(files);
  }
  // 默认展开最近一天并打开第一份
  box.querySelector('.date').click();
  const first = box.querySelector('.files a');
  if (first) first.click();
}

async function openReport(date, f, a) {
  curDate = date; curFile = f.name;
  document.querySelectorAll('aside .files a').forEach(x => x.classList.remove('on'));
  a.classList.add('on');
  const r = await (await fetch(
    `/api/reports/content?date=${encodeURIComponent(date)}&name=${encodeURIComponent(f.name)}`)).json();
  if (!r.ok) { $('#view').textContent = r.detail || '加载失败'; return; }
  // mermaid 块先摘出来，避免被 marked 当普通代码渲染
  const blocks = [];
  const src = r.md.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
    blocks.push(code);
    return `\n<div class="mermaid-pending" data-i="${blocks.length - 1}"></div>\n`;
  });
  $('#view').innerHTML = marked.parse(src, { breaks: false, gfm: true });
  document.querySelectorAll('.mermaid-pending').forEach(div => {
    const holder = document.createElement('div');
    holder.className = 'mermaid';
    holder.textContent = blocks[+div.dataset.i];
    div.replaceWith(holder);
  });
  await mermaid.run({ querySelector: '.mermaid' });
}

mermaid.initialize({ startOnLoad: false, theme: 'neutral',
                     xyChart: { plotColorPadding: 6 } });
loadList();
</script>
</body>
</html>
