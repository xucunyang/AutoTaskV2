default_policy: privacy_first

# ---------------------------------------------------------------------------
# 模型注册表
# ---------------------------------------------------------------------------
# 想加模型/换模型，只改这一块；想改"哪个复杂度用哪个模型"，
# 只改下面 complexity_models。两件事分开，以后接多个厂商/多个额度包
# （比如不同token套餐给不同key）就是往 models 里加条目，不动代码。
#
# 每个条目统一字段：
#   type          ollama | openai_compat
#   base_url      ${VAR} 会从 .env 取值（真实环境变量优先于.env）
#   api_key_env   密钥的变量名（值不进仓库，只在.env里）
#   model         模型名（openai_compat 必填）
#   path          URL 后缀。DeepSeek 是 /chat/completions，
#                 标准OpenAI是 /v1/chat/completions，不统一，所以要能配
#   context_window null = 走动态计算（见 context_profiles）
#   models        仅 ollama：复杂度→模型名。配了哪些 key 就决定本地能做哪些
#                 复杂度，没配的复杂度自动走在线，不猜不降级
models:
  local:
    {
      type: ollama,
      base_url: http://localhost:11434,
      models: { simple: qwen3.5:4b },
      # 思维模型关掉思考：实测同一任务卡 think=false 6.6s / 默认 21.4s，
      # 正确性相同。simple 任务不需要长思考，延迟差3倍很值。
      # （不写=按模型默认；写 true=强制思考）
      think: false,
      context_window: null,
      timeout_s: 120,
      enabled: true,
      max_concurrency: 1,
      slo_p50_ms: 15000,
    }
  # MiniMax：按 token 套餐计费的通道。2026-10-09 用户调整分工：
  # **只服务 simple/medium（中低档）**，complex 让位给 glm——
  # 套餐额度优先花在小任务上更划算，高档任务交给 GLM 套餐。
  # 额度耗尽时熔断/限流，FallbackProvider 自动回到下面的 flash/local。
  #
  # path 要与 base_url 配套，两种写法只能选一种，别叠加：
  #   base_url .../v1        + path /chat/completions
  #   base_url ...（裸host） + path /v1/chat/completions
  # 叠成 .../v1/v1/chat/completions 的表现是 404，很难一眼看出。
  #
  # 注意别把 base_url 指到 https://api.minimax.cn/anthropic——那是
  # Anthropic 协议端点（路径 /anthropic/v1/messages），本 provider 是
  # openai_compat，协议不通用。
  minimax:
    {
      type: openai_compat,
      base_url: "${MINIMAX_BASE_URL}",
      api_key_env: MINIMAX_API_KEY,
      model: "${MINIMAX_MODEL}",
      path: /chat/completions,   # base_url 已含 /v1，这里只补段
      context_window: null,      # 走 context_profiles 按模型名估
      timeout_s: 180,
      enabled: true,
      max_concurrency: 4,
      extra_body: { thinking: { type: "disabled" } },  # 简单任务不需要长思考
    }
  # 智谱 GLM（2026-10-09 接入，用户点名）：**complex 专用第一跳**。
  # ⚠️ 端点必须是 Coding Plan 专用 coding/paas/v4——同一把 key 打标准
  # paas/v4 会 429「余额不足或无可用资源包」（实测 2026-10-09：coding
  # 端点 glm-4.6/5 全 200，标准端点全 429）。这不是没配好，是两套计费。
  # 与 minimax 一样是 token 套餐：额度耗尽（402/429/quota 文案）由
  # FallbackProvider 自动落到链上下一跳 pro（按量付费，总有额度）——
  # 「额度用完回落到有额度的那个」就是 chains 的既有语义，无需新代码。
  # 没配 key 时 build_models 不注册本条目，complex 链塌缩成 [pro]，
  # 行为与接入前完全一致（401 鉴权失败是永久错误、不降级，key 填错
  # 时整链硬炸，所以 key 变量名要盯紧）。
  # thinking 关闭与 minimax 同理：正文够用，省 token；更关键的是多轮
  # 工具循环回传 assistant 消息时，思考模型的 reasoning_content 回传
  # 要求在多家 API 上都是坑（deepseek 已实测炸过 http_400）。
  glm:
    {
      type: openai_compat,
      base_url: "https://open.bigmodel.cn/api/coding/paas/v4",
      api_key_env: ZHIPU_GLM_API_KEY,
      model: glm-4.6,           # 套餐若含更新的型号（如 glm-5）只改这一行
      path: /chat/completions,
      context_window: null,
      timeout_s: 180,
      enabled: true,
      max_concurrency: 4,
      extra_body: { thinking: { type: "disabled" } },
    }
  # 快模型：适合 medium 及以下的批量活
  flash:
    {
      type: openai_compat,
      base_url: "${ONLINE_BASE_URL}",
      api_key_env: ONLINE_API_KEY,
      model: "${ONLINE_FLASH_MODEL}",
      path: /chat/completions,
      context_window: null,
      timeout_s: 90,
      enabled: true,
      max_concurrency: 8,
    }
  # 强模型：只给 complex 用
  pro:
    {
      type: openai_compat,
      base_url: "${ONLINE_BASE_URL}",
      api_key_env: ONLINE_API_KEY,
      model: "${ONLINE_PRO_MODEL}",
      path: /chat/completions,
      context_window: null,
      timeout_s: 180,
      enabled: true,
      max_concurrency: 4,
    }

# ---------------------------------------------------------------------------
# 复杂度 → 模型引用（改这两三行就能整体换模型分配）
# ---------------------------------------------------------------------------
complexity_models:
  # 本地接 simple（2026-09-30 修正：之前误判为"本地跑不了 tool loop"）。
  # 真实原因是**我们回填 assistant.tool_calls 时用了 OpenAI 形状**
  # （arguments 是JSON字符串），而ollama要求dict——所以第一步正常、
  # 文件也真写出来了，到第二步才400，看上去像"模型JSON生成坏了"。
  # 修好方言后本地可用：qwen3.5:4b 能稳定产出并落盘。
  # medium/complex 仍走在线：4B 的长文分析与多轮推理质量不够。
  # 注意：这里指向的是下面 chains 里的链名，不是单个 provider。
  # 链在 minimax 没配 key 时会自动塌缩成原来的 local/flash/pro，
  # 所以启用 minimax 不需要改这一行——只改 chains 的成员顺序即可。
  { simple: simple_chain, medium: medium_chain, complex: complex_chain }

# ---------------------------------------------------------------------------
# 降级链：每一档一个"按顺序试"的组合。第一个能用就用它，额度/限流/熔断
# 就换下一个，最后一跳还不行才把错误抛给上层（走既有 RETRY/死信逻辑）。
#
# 2026-10-09 用户调整分工后的最终行为：
#   simple : minimax → local   （MiniMax = 低档）
#   medium : minimax → flash   （MiniMax = 中档；额度耗尽回落 flash）
#   complex: glm → pro         （GLM = 高档；额度耗尽回落 pro 按量付费）
# 没配 key 的成员自动从链上消失（glm/minimax 皆然），于是：
#   glm 没配 key   → complex 塌缩成 [pro]，与接入前一致
#   minimax 没配 key → simple/medium 塌缩成 [local]/[flash]
# 任一 token 套餐额度耗尽（402/429/quota/overloaded 文案）→ 链上下一跳
# 接手，这就是「回落到有额度的那个」：glm 没额度走 pro，minimax 没额度
# 走 local/flash。降级留痕（served_by / fell_from），产物谁写的可查。
# ---------------------------------------------------------------------------
chains:
  simple_chain:  [minimax, local]
  medium_chain:  [minimax, flash]
  complex_chain: [glm, pro]

# 隐私强制覆盖：secret 任务不外发，无论复杂度都走这里指定的模型
privacy_models:
  { secret: local }

# 复杂度没配时的兜底模型（不要指向 local，否则会静默降级）
default_model: flash

policies: [privacy_guard, latency_guard, capability_match]
# 能力分档参考表（仅供人看，不参与路由；路由只看 complexity_models）
local_tiers:
  {
    3B: { max_complexity: simple },
    4B: { max_complexity: simple },
    7B: { max_complexity: medium },
  }
routing:
  {
    secret: { allow: [local], fallback: local-retry-then-human },
    public-simple: { allow: [local, flash, pro], prefer: local },
    public-complex: { allow: [flash, pro], fallback: online-retry-then-deadletter },
  }
# 网关层成本预算（与TaskShard执行限制不同层面）
budgets: { per_task_tokens: 8000, per_day_online_tokens: 200000 }
latency_guard:
  {
    queue_threshold: 4,
    fail_threshold: 3,
    cooldown_s: 300,
    local_simple_timeout: 20,
    local_medium_timeout: 60,
  }
# V7§8: 隐私默认关闭，只留扩展接口（classify/redact/PrivacyGuard保留，enqueue/route/日志跳过扫描与脱敏）
privacy: { enabled: false }
# V7§10: session切换判定阈值（context_window的80%触发让出）
session_yield: { context_ratio: 0.8 }
# V7动态窗口分档：建议值是上限非固定值，最终取min(架构上限,档位建议,显存可撑,配置覆盖)
# 原因：Ollama默认4096且架构上限因模型而异（Qwen2.5-7B是128K/Qwen3-14B只有40K），写死必错；
# KV随层数×头数增长快于参数量，14B@64K要12G所以L档给64K而XL只给32K
context_profiles:
  - { max_params_b: 4, context_window: 32768 }
  - { max_params_b: 7, context_window: 65536 }
  - { max_params_b: 14, context_window: 65536 }
  - { max_params_b: 999, context_window: 32768 }
# 系统提示+工具定义+completion预留（粗值不拆细，32K窗口下占25%）
context_reserved: 8192
# 本地可用门禁：usable低于此值→本地不可用→路由走在线
min_usable: 16384
memory:
  { system_reserved_gb: 5, fallback_local: 65536, fallback_online: 262144 }
