    display_name: RTX 4060 8GB
  # 观察名单（未发售不入库，发售即加）：
  #   RTX 50 SUPER 系列（5060S 12G / 5070S 18G / 5070TiS 24G / 5080S 24G，
  #   传闻 2026 末-2027 初）；5070 官方无 16G 版（16G 是 5070 Ti）。
