# 硬件域首发实体种子清单（Q7 拍板：~30 个主流 SKU，P0 建库时导入）。
# identity 键序 = 契约声明序 [category, series, spec]。
# perf_anchor 留空：Q14 拍板用手机看京东/天猫官方旗舰店销量定基底
# （同代销量最大者=1.0），P0 骨架完成后采集时顺带定，不在此猜。
domain: hardware
entities:
  # ---- NVIDIA 50 系 ----
  - identity: {category: 显卡, series: RTX 5090, spec: 32GB}
    display_name: RTX 5090 32GB
    aliases: ["5090", "RTX5090"]
  - identity: {category: 显卡, series: RTX 5090D, spec: 32GB}
    display_name: RTX 5090D 32GB
    aliases: ["5090D", "5090 D"]
