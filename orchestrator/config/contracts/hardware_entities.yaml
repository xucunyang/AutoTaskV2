# 硬件域首发实体种子清单（Q7 拍板：~30 个主流 SKU，P0 建库时导入）。
# identity 键序 = 契约声明序 [category, series, spec]。
# perf_anchor 留空：Q14 拍板用手机看京东/天猫官方旗舰店销量定基底
# （同代销量最大者=1.0），P0 骨架完成后采集时顺带定，不在此猜。
domain: hardware
entities:
  # ---- NVIDIA 50 系（已发售全型号，R30 核对于 2026-10-11）----
  - identity: {category: 显卡, series: RTX 5090, spec: 32GB}
    display_name: RTX 5090 32GB
    aliases: ["5090", "RTX5090"]
  - identity: {category: 显卡, series: RTX 5090D, spec: 32GB}
    display_name: RTX 5090D 32GB
    aliases: ["5090D", "5090 D"]
  - identity: {category: 显卡, series: RTX 5090D V2, spec: 24GB}
    display_name: RTX 5090D V2 24GB
    aliases: ["5090D V2", "5090Dv2", "5090 D v2"]
  - identity: {category: 显卡, series: RTX 5080, spec: 16GB}
    display_name: RTX 5080 16GB
  - identity: {category: 显卡, series: RTX 5070 Ti, spec: 16GB}
    display_name: RTX 5070 Ti 16GB
  - identity: {category: 显卡, series: RTX 5070, spec: 12GB}
    display_name: RTX 5070 12GB
  - identity: {category: 显卡, series: RTX 5060 Ti, spec: 16GB}
    display_name: RTX 5060 Ti 16GB
  - identity: {category: 显卡, series: RTX 5060 Ti, spec: 8GB}
    display_name: RTX 5060 Ti 8GB
    aliases: ["5060Ti 8G", "5060 TI 8GB"]
  - identity: {category: 显卡, series: RTX 5060, spec: 8GB}
    display_name: RTX 5060 8GB
  - identity: {category: 显卡, series: RTX 5050, spec: 8GB}
    display_name: RTX 5050 8GB
  # ---- AMD RX 9000 系 ----
  - identity: {category: 显卡, series: RX 9070 XT, spec: 16GB}
    display_name: RX 9070 XT 16GB
  - identity: {category: 显卡, series: RX 9070, spec: 16GB}
    display_name: RX 9070 16GB
  - identity: {category: 显卡, series: RX 9070 GRE, spec: 12GB}
