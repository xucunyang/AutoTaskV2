# 慢慢买回填 listing 注册表（R27）。
#
# 定位：**人工甄别一次，程序永久复用**——URL 发现（DDG 搜索）与
# spName 规格甄别是唯一需要人的环节（AI 只辅助生成候选，拍板在人），
# 之后 fetch→转换→入库全程零模型参与。
#
# 甄别纪律（2026-10-14 首批实测教训）：
# * spName 必须含完整规格（8G/16G），DDG 候选会混入错误规格
#   （RTX 5060 混进 5060 Ti 桶、16G 混进 8G 桶）——对不上就丢；
# * channel 是**这个 listing 的渠道档位**（京东 POP 三方店填 第三方，
#   自营/官旗填 自营），人工核定一次；
# * 每实体建议 2-3 个 listing（走量款+入门款）：trend_calc 的
#   manmanmai 轨 aggregate_rule=min 自动取多 listing 当日最低，
#   单 listing 被第三方接盘抬价时天然对冲（16G 魔鹰 6941 vs
#   小雕 4999 的教训）；
# * listing 失效（下架/改规格）时在行上补 retired: 日期，不要删行
#   （保留审计轨迹）。

domain: hardware          # 契约域（config/contracts/hardware.yaml）
source: manmanmai         # 契约 source 枚举，固定值
listings:
  - identity: {category: 显卡, series: RTX 5060 Ti, spec: 8GB}
    vendor: 技嘉
    channel: 自营
    url: https://item.jd.com/100211023968.html
    sp_name: 技嘉（GIGABYTE）5060Ti 8G显卡 魔鹰
    verified: "2026-10-14 18:53"   # 首采 410 点（2025-09-01 起）
  - identity: {category: 显卡, series: RTX 5060 Ti, spec: 16GB}
    vendor: 技嘉
    channel: 自营
    url: https://item.jd.com/100211023996.html
    sp_name: 技嘉（GIGABYTE）5060Ti 16G显卡 魔鹰
    verified: "2026-10-14 18:53"   # 首采 394 点（2025-09-17 起）
  - identity: {category: 显卡, series: RTX 5060 Ti, spec: 16GB}
