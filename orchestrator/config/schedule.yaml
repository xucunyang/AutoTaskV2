jobs:
  - id: daily_report
    cron: "0 8 * * *"
    timezone: Asia/Shanghai
    template: templates/daily_plan.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 六边形战士城市（2026-10-07 从 housing_daily 拆出，半月一次，06:00）。
  # 南京/徐州/西宁租售比高小区 Top20（每 5 天一次，2026-10-08 用户点名新增：
  # "调查南京徐州西宁（暂定这三个）租售比高的小区排名 top20，每个城市 20 个"）。
  # cron 的日字段 1,6,11,16,21,26 = 每月 6 个触发日 ≈ 每 5 天一次。不用 */5：
  # */5 在 31 天的月份会跑出 1/6/11/16/21/26/31 七次，月末那次落在 31 号；
  # 显式六天列表才与 XML 的 DaysOfMonth 精确一致（同 fortnight 1,15 的理由）。
  # 11:00：与 10:00（housing_daily）/ 14:00（hardware）都错开充足，
  # 不挤在早上 6 点的慢链堆里。
  - id: housing_rr_fiveday
    cron: "0 11 1,6,11,16,21,26 * *"
    timezone: Asia/Shanghai
    template: templates/housing_rr_fiveday.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 21600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 房贷贴息分线城市月度跟踪（每月 8 日 06:40）。
  # 同样从 housing_daily 拆出：这条统计的是月度/季度口径，用户的判断是
  # "每天执行完数据都一样，没有什么意义"。
  # 定 8 日而不是 1 日：月初各城市住建局/统计局的上月数据还没出，
  # 1 号跑必然只能抄上上个月的数。
  # 06:40 与 housing_fortnight 的 06:00 错开 40 分钟——
  # 两条 run_daily 并行写 state.db 是没验证过的姿势（test_jobs_are_spread_out_in_time 卡 30 分钟下限）。
  - id: housing_monthly
    cron: "40 6 8 * *"
    timezone: Asia/Shanghai
    template: templates/housing_monthly.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 21600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 每日股票与投资理财跟踪（2026-10-05 新增，用户点名；2026-10-08
  # 拆双时间点：08:50 盘前视角 + 18:10 收市视角）。两个时间点共用
  # templates/finance_daily.yaml，模板 objective 已通用化（"现在能取到
  # 的最近一个已收盘交易日"），不需要拆 template。
  # 08:50 = A 股开盘（9:30）之前，采到的必然是**最近一个已收盘 A 股日**
  # + 昨夜美股；18:10 = A 股已收盘，采到**今日** A 股 + 昨夜美股。
  # 18:10 那次会**覆盖** 08:50 那次的 finance_summary.json——这是 C 方案
  # 代价最小的取舍；若要彻底两套产物，需要拆 template 与 acceptance。
  - id: finance_daily
    cron: "50 8 * * *"
    timezone: Asia/Shanghai
    template: templates/finance_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # finance_postclose：每日收市后重写一次（与 finance_daily 共用模板，
  # 见 finance_daily 的注释）。两条 schedule 共用一份模板时 artifacts 路径
  # 会撞——test_job_matrix 已钉死"两两不相交"，但 finance_daily 与
  # finance_postclose 都用 templates/finance_daily.yaml 是显式的同路径
  # 例外：这条豁免由 schedule.yaml 这里手写注释 + test_job_matrix 的
  # finance_daily/fnance_postclose 白名单承担（10-08 加）。
  - id: finance_postclose
    cron: "10 18 * * *"
    timezone: Asia/Shanghai
    template: templates/finance_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 政策跟踪（2026-10-06 新增，要三农与工薪阶层）。
  # 2026-10-14 用户裁决：改**半月一次**（与 housing_fortnight 同频）。
  # 时刻 07:20：housing_fortnight 06:00 + 30min（满足 test_jobs_are_spread_out_in_time
  # 30-min 门禁），与 housing_monthly 06:40 也错开 40min。原选 06:20 撞
  # housing_monthly 06:40（20min 违规），调到此点。id 保持 policy_daily
  # 不破坏历史 plan_id（id 改名会让 policy_daily_YYYY-MM-DD 风格变化，
  # 影响 test_job_matrix 的白名单与历史查询）。
  - id: policy_daily
    cron: "20 7 1,15 * *"
    timezone: Asia/Shanghai
    template: templates/policy_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
# V6§7 V5值：两档配额 + governor阈值（ACTIVE约1/8共享1槽，IDLE约85%）
# 注意：下面这些都是**顶层键**，不要缩进到 workers: 里去——
# workers 是 flow mapping（{...}），挂不了子键，缩进会让整个文件解析失败。
# 而 core.orchestrator._load_cfg 会吞掉解析异常（现在会记 config_parse_failed），
# 于是配置静默变成默认值（governor不生效/租约参数全部回落）。
workers: {executor_active: 1, verifier_active: 0, local_active: 0, executor_idle: 4, verifier_idle: 2, local_idle: 1, shared_active_slot: 1, reserved_low_slot: 1}
# 动态算力总督：每tick采样，写进 max_workers。手动override用
# `python -m core.governor --mode idle|active|auto`。
governor: {enabled: true, idle_after_s: 300, confirm_samples: 2, mem_headroom_gb: 2, high_burst: 1}
# V6§10定版 + 评审B2收敛：租约/心跳/取消宽限/轮询集中于此，不散落魔法数字
lease: {ttl_s: 120, heartbeat_s: 30, cancel_grace_high_s: 30, cancel_grace_default_s: 60}
# 单实例锁的存活期：心跳超过这个时间未刷新即允许接管。
# 必须远大于 poll.normal_s（10s），否则一个卡住的tick就会让别人以为它死了。
# 两个编排器短暂并行的代价小（派发靠 expect_version 幂等），
# 而一次 kill -9 导致系统永久起不来的代价极大——不划算。
lock: {ttl_s: 90}
poll: {normal_s: 10, fast_s: 2}
aging: {step1_after_s: 600, step1_to: 5, step2_after_s: 1200, step2_to: 3}
# 让出熔断上限（单任务切换超K次改走FAILED，Phase1§2.2）
session_switch_limit: 5
