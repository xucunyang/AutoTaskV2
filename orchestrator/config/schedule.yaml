jobs:
  - id: daily_report
    cron: "0 8 * * *"
    timezone: Asia/Shanghai
    template: templates/daily_plan.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 每日房地产跟踪（分能级 / 徐州南京 / 六边形战士 / 纵向汇总）。
  # plan_id 按 job_id 分立：daily_report_YYYY-MM-DD vs housing_daily_YYYY-MM-DD，
  # 两个 job 各自的 plan/tasks/产物目录互不干扰（同一日期也能并存）。
  # cron 10:00 而不是 08:00（2026-10-05 修正）：Windows 计划任务
  # （scripts/housing_daily_task.xml 的 StartBoundary）一直是 10:00，
  # 这里长期写着 08:00——谁哪天启了 APScheduler 守护进程，两条链就会挤在
  # 8 点同时跑。cron 与 XML 不一致本身就被 test_job_matrix 钉住了。
  - id: housing_daily
    cron: "0 10 * * *"
    timezone: Asia/Shanghai
    template: templates/housing_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 六边形战士城市（每月 1 日与 15 日 06:00）。
  # 2026-10-07 从 housing_daily 拆出，理由见 templates/housing_fortnight.yaml：
  # 房价收入比/租售比/薪资水平是月度甚至季度更新的数据，每天跑没有新信息。
  # 用户在"一个月 / 每半个月"之间选了**每半个月**。
  # cron 的 1,15 对应 XML 里的 ScheduleByMonth + DaysOfMonth 1 和 15
  # （Windows 的 ScheduleByDay/DaysInterval 表达不出"每月 1 号和 15 号"，
  #  用 DaysInterval=14 会在 31 天的月份跑出 1/16/31 三次，不是半个月）。
  - id: housing_fortnight
    cron: "0 6 1,15 * *"
    timezone: Asia/Shanghai
    template: templates/housing_fortnight.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 21600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 房贷贴息分线城市月度跟踪（每月 8 日 06:40）。
  # 同样从 housing_daily 拆出：这条统计的是月度/季度口径，用户的判断是
  # "每天执行完数据都一样，没有什么意义"。
  # 定 8 日而不是 1 日：月初各城市住建局/统计局的上月数据还没出，
  # 1 号跑必然只能抄上上个月的数。
  # 06:40 与 housing_fortnight 的 06:00 错开 40 分钟——
  # 两条 run_daily 并行写 state.db 是没验证过的姿势（test_jobs_are_spread_out_in_time 卡 30 分钟下限）。
  - id: housing_monthly
    cron: "40 6 8 * *"
    timezone: Asia/Shanghai
    template: templates/housing_monthly.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 21600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 每日股票与投资理财跟踪（2026-10-05 新增，用户点名）。
  # 08:30 = A 股开盘（9:30）之前，采到的必然是**上一交易日**收盘
  # + 昨夜美股——这是口径，模板 objective 里写死了，免得模型编"今天的涨跌"。
  - id: finance_daily
    cron: "30 8 * * *"
    timezone: Asia/Shanghai
    template: templates/finance_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 每日硬件跟踪（显卡/内存价格 + 硬件新闻，2026-10-05 新增）。
  # 14:00：与 08:00 / 08:30 / 10:00 都错开 ≥2h，避免两条链同时写 state.db
  # （两个 run_daily 并行是没验证过的姿势）。
  - id: hardware_daily
    cron: "0 14 * * *"
    timezone: Asia/Shanghai
    template: templates/hardware_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
  # 每日政策跟踪（新政/废止/影响分析，2026-10-06 新增，用户点名要三农与工薪阶层）。
  # 16:00 = **排在最后是有意的**：部委/国务院的当日文件多在下午上网，
  # 早上跑只能捡前一天的口径；排最后才吃得到当天的。
  # 与前四条错开 ≥2h，避免两条链同时写 state.db。
  - id: policy_daily
    cron: "0 16 * * *"
    timezone: Asia/Shanghai
    template: templates/policy_daily.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
# V6§7 V5值：两档配额 + governor阈值（ACTIVE约1/8共享1槽，IDLE约85%）
# 注意：下面这些都是**顶层键**，不要缩进到 workers: 里去——
# workers 是 flow mapping（{...}），挂不了子键，缩进会让整个文件解析失败。
# 而 core.orchestrator._load_cfg 会吞掉解析异常（现在会记 config_parse_failed），
# 于是配置静默变成默认值（governor不生效/租约参数全部回落）。
workers: {executor_active: 1, verifier_active: 0, local_active: 0, executor_idle: 4, verifier_idle: 2, local_idle: 1, shared_active_slot: 1, reserved_low_slot: 1}
# 动态算力总督：每tick采样，写进 max_workers。手动override用
# `python -m core.governor --mode idle|active|auto`。
governor: {enabled: true, idle_after_s: 300, confirm_samples: 2, mem_headroom_gb: 2, high_burst: 1}
# V6§10定版 + 评审B2收敛：租约/心跳/取消宽限/轮询集中于此，不散落魔法数字
lease: {ttl_s: 120, heartbeat_s: 30, cancel_grace_high_s: 30, cancel_grace_default_s: 60}
# 单实例锁的存活期：心跳超过这个时间未刷新即允许接管。
# 必须远大于 poll.normal_s（10s），否则一个卡住的tick就会让别人以为它死了。
# 两个编排器短暂并行的代价小（派发靠 expect_version 幂等），
# 而一次 kill -9 导致系统永久起不来的代价极大——不划算。
lock: {ttl_s: 90}
poll: {normal_s: 10, fast_s: 2}
aging: {step1_after_s: 600, step1_to: 5, step2_after_s: 1200, step2_to: 3}
# 让出熔断上限（单任务切换超K次改走FAILED，Phase1§2.2）
session_switch_limit: 5
