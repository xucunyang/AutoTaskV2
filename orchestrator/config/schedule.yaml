jobs:
  - id: daily_report
    cron: "0 8 * * *"
    timezone: Asia/Shanghai
    template: templates/daily_plan.yaml
    coalesce: true
    max_instances: 1
    misfire_grace_time: 3600
    catchup: true
    max_workers: 4
    poll_interval_s: 30
# V6§7 V5值：两档配额 + governor阈值（ACTIVE约1/8共享1槽，IDLE约85%）
workers: {executor_active: 1, verifier_active: 0, local_active: 0, executor_idle: 4, verifier_idle: 2, local_idle: 1, shared_active_slot: 1, reserved_low_slot: 1}
governor: {idle_after_s: 300, confirm_samples: 2, active_cpu: 0.125, idle_cpu: 0.85, mem_headroom_gb: 2, high_burst: 1}
# V6§10定版 + 评审B2收敛：租约/心跳/取消宽限/轮询/老化集中于此，不散落魔法数字
lease: {ttl_s: 120, heartbeat_s: 30, cancel_grace_high_s: 30, cancel_grace_default_s: 60}
poll: {normal_s: 10, fast_s: 2}
aging: {step1_after_s: 600, step1_to: 5, step2_after_s: 1200, step2_to: 3}
# 让出熔断上限（单任务切换超K次改走FAILED，Phase1§2.2）
session_switch_limit: 5
