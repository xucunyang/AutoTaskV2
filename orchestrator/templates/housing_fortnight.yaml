plan_template: housing_fortnight
# 六边形战士城市（每月 1 日与 15 日 06:00）。
#
# 2026-10-07 从 housing_daily 拆出。理由是用户判断：房价收入比、租售比、
# 薪资水平这类数据本身是月度甚至季度更新的，每天跑没有新信息。
# 用户在"一个月 / 每半个月"之间选了**每半个月一次**——
# 所以是 1 日与 15 日两次，不是一个月一次。
tasks:
  - id: t3_hexagon
    name: 六边形战士城市
    complexity: complex
    key_questions:
      - "哪些城市在工作机会与薪资水平上表现最好？具体指标是什么？"
      - "哪些城市在生活成本、医疗、教育、交通方面最均衡？"
      - "哪些城市的房价收入比与租售比最合理？"
      - "把工作、生活、房价三维都均衡的城市有哪些？哪些城市明显偏科？"
    objective: >-
      找出在工作、生活、房价三个维度都均衡的"六边形战士"型城市。
      三个维度分别明确：工作（岗位密度、薪资水平、产业多元性）、
      生活（医疗、教育、交通、气候、环境）、
      房价（房价收入比、租售比、相对省会或同能级的价格分位）。
      给出候选城市清单与每个城市在三维上的具体数据，
      指出哪些城市是三项均衡的、哪些是明显偏科的。
      **评分所依据的数据注明是哪个月/哪一期的口径**——
      本任务每半个月跑一次，两次之间底层数据往往没变，
      正文要显式说明"本期相对上期哪些指标变了"，没变就直说没变，
      不要为了显得有更新而改数。
      写入 artifacts/{date}/t3_hexagon_cities.md。
      结论必须可证伪——写明用什么指标在什么时间点能验证该城市是否仍均衡。
    depends_on: []
    outputs: ["artifacts/{date}/t3_hexagon_cities.md"]
    acceptance_ref: schemas/acceptance_market.yaml
    needs_web: true
    freshness: recent
    max_attempts: 3
    budget: {max_steps: 10, timeout_s: 600}