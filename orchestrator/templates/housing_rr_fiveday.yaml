plan_template: housing_rr_fiveday
# 租售比高小区 Top20（南京/徐州/西宁，每 5 天跑一次）。
#
# 2026-10-08 用户点名新增："增加一个新任务，每5天运行一次，调查南京徐州西宁
# （暂定这三个）租售比高的小区排名 top20（每个城市 20 个）。"
#
# cron 用 `1,6,11,16,21,26` 而不是日字段 `*/5`：`*/5` 在 31 天的月份会跑出
# 1/6/11/16/21/26/31 **七次**，月末那次落在 31 号；显式六天列表 + Windows
# XML 的 DaysOfMonth 1/6/11/16/21/26 才是机械上精确的"每 5 天一次"（理由
# 与 housing_fortnight 的 1,15 相同，见 schedule.yaml 注释）。
# 城市"暂定这三个"——以后要加城市只需改本文件 cities 列表与 schema 的
# allOf/contains，产物路径与验收不用动。
tasks:
  - id: t_rr_top20
    name: 南京徐州西宁租售比高小区 Top20
    complexity: complex
    key_questions:
      - "南京、徐州、西宁各有哪些租售比（年化租金回报率）最高的小区？前 20 名分别是谁，各多少？"
      - "每个小区的单方月租金、挂牌或成交单价、年化租售比具体数字是多少？来源与统计期是什么？"
      - "三城之间租售比最高的档位差异多大？租售比高的小区有什么共性（总价段/位置/房龄）？"
    objective: >-
      调查南京、徐州、西宁三座城市**租售比最高**的前 20 个小区，每城 20 个。
      租售比口径**固定为年化租金回报率**：年化租售比（%）= 单方月租金 × 12 ÷
      单价 × 100；单价与租金必须**同一口径**（要么都按挂牌、要么都按成交），
      并写明用的是哪一期数据（如「2026年9月挂牌」/「近30天成交」）。
      每城 Top20 按租售比从高到低排名，逐个给出：名次、小区名、所属区、
      单方月租金（元/㎡·月）、单价（元/㎡）、年化租售比（%，数字不带%号）、
      数据来源平台/页面。排名必须可证伪——写明口径与统计期，读者能在同一
      统计期内复现。查不到的小区写"数据缺失"，**不得编造小区名或抄别的城
      市/上期的数顶替**。
      正文写入 artifacts/{date}/t_rr_top20.md（含三城对比：最高档位、
      中位数、共性特征），同一批数字另存为结构化
      artifacts/{date}/t_rr_top20.data.json（字段见任务卡）。
      城市暂定为南京、徐州、西宁三座。
    depends_on: []
    outputs:
      - artifacts/{date}/t_rr_top20.md
      - artifacts/{date}/t_rr_top20.data.json
    acceptance_ref: schemas/acceptance_rr_top20.yaml
    # 联网检索：小区级租售比没有"参数内知识"，必须查平台数据。
    needs_web: true
    freshness: recent
    max_attempts: 3
    budget: {max_steps: 10, timeout_s: 600}