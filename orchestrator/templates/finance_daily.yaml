plan_template: finance_daily
# 每日股票与投资理财跟踪（2026-10-05 新增，用户点名要）。
#
# 与 daily/housing 共用 artifacts/{date}/ 目录，但**产物名全部独立**：
# summary.json / report.md / charts.md 都是 daily 的，这条链一律不碰
# （10-05 实测过共用路径的后果：后跑的把先跑的覆盖掉，tests/test_job_matrix.py
#  现在把"不许撞车"钉成了门禁）。
#
# 时刻：08:50 盘前视角（A 股未开盘→采最近已完成 A 股日 + 昨夜美股）；
# 18:10 收市视角（A 股已收盘→采今日 A 股 + 昨夜美股）。两个时间点共用同一
# 模板，objective 必须对两个时间点都成立——下面写法让模型**自己判断
# "现在能取到哪些"**而不是被时刻限制。
# 注意：18:10 那次会**覆盖** 08:50 那次的 finance_summary.json——这是
# C 方案代价最小的取舍；若要彻底两套产物，需要拆 template 与 acceptance，
# 本轮不做。
tasks:
  - id: t1_stocks
    name: 行情采集
    complexity: complex
    key_questions:
      - "现在能取到的最近一个 A 股已收盘交易日（无论 08:50 还是 18:10 跑批都按最近一个已收盘取），上证/深成/创业板/科创50 收盘点位与涨跌幅是多少？"
      - "港股最近一个已收盘交易日恒指/恒科/国企指数收盘点位与涨跌幅？"
      - "美股最近一个已收盘交易日（北京 08:50 时是昨仅美股、18:10 时也是昨仅）三大指数收盘点位与涨跌幅？"
      - "三市场各自的领涨领跌行业板块？"
    objective: >-
      检索并采集**各市场各自最近一个已收盘交易日**数据（不取未来——08:50 跑批时
      A 股今日未开盘就取最近一个已收盘 A 股日；18:10 跑批时 A 股今日已收盘
      就取今日；港股同理）。**美股**取"距离本次跑批最近一个美东已收盘日"——08:50 时
      是昨仅、18:10 时也是昨仅（北京时间的美子已收盘窗口 04:00 才出齐）。
      **不许把全市场统一成一个日期**：A 股/港股/美股各自的最近一个已收盘日
      可能不同（节假日错位），CSV 里**每行写该市场自己的**——而不是全表统一。
      CSV 输出到 artifacts/{date}/t1_stocks.csv：**至少 15 行、至少 6 列**，
      列须含：标的（指数/板块/个股）、市场（A股/港股/美股）、收盘点位或收盘价、
      涨跌幅(%)、成交额、交易日(YYYY-MM-DD)。
      每个数字必须能在你引用的原文里逐字找到；查不到的项留空并写
      "未查到"，**不许估算或凭记忆补**。同时交齐 sources.json / claims.json，
      优先引交易所、指数公司、证监会与主流财经数据门户（验收要求 A 类来源占比 ≥20%）。
    depends_on: []
    outputs: ["artifacts/{date}/t1_stocks.csv"]
    acceptance_ref: schemas/acceptance_finance_t1.yaml
    needs_web: true
    freshness: recent
    max_attempts: 3
    budget: {max_steps: 12, timeout_s: 720}

  - id: t2_investment
    name: 投资理财动态
    complexity: complex
    key_questions:
      - "近期公募基金发行与收益情况如何？哪些品类表现靠前？"
      - "银行理财、存款、国债、货币基金的收益率水平各是多少？"
      - "监管与货币政策有什么新动向（降准降息、新规、并购重组）？"
      - "当期普通投资者面临的主要风险与机会是什么？"
    objective: >-
      检索并汇总当前的投资理财动态：基金发行与业绩、银行理财与存款利率、
      债券与货基收益、监管与货币政策动向。写入
      artifacts/{date}/t2_investment.md，正文至少 800 字节、**至少 1 张
      mermaid 图**（收益对比或期次走势，数据逐字取自来源原文），
      每条结论标注来源与统计口径，查不到的写"未查到"而不是估。
      **只做事实汇总与观察，不给具体买卖建议、不做收益预测**。
    depends_on: []
    outputs: ["artifacts/{date}/t2_investment.md"]
    # {output} 让这份验收被多条 md 任务共用，各查各的产物
    acceptance_ref: schemas/acceptance_market.yaml
    needs_web: true
    freshness: recent
    max_attempts: 3
    budget: {max_steps: 10, timeout_s: 600}

  - id: t3_finance_report
    name: 生成日报
    complexity: complex
    objective: >-
      基于 artifacts/{date}/t1_stocks.csv 与 artifacts/{date}/t2_investment.md 生成：
      ① artifacts/{date}/finance_summary.json——顶层**必须**有这 5 个字段，
         缺一个或类型不对 = rule_2 schema_violation：
         {"date": "YYYY-MM-DD",
          "data_period": {"A股": "YYYY-MM-DD", "港股": "YYYY-MM-DD", "美股": "YYYY-MM-DD"},
          "rows": <整数行数>, "market_summary": <按市场的汇总对象>,
          "key_findings": ["结论1", "结论2"]}
         `data_period` 现在是**按市场的对象**，每个 key 对应该市场最近行情
         交易日：A 股 = 9-30（节前最后）；港股 = 港股最近；美股 = 10-05 美东；
         不许三市场统一成一个日期、不许把美股写成 9-30。
         `rows` 是 t1_stocks.csv 的**整数行数**（如 18）：不是数组、不放个股明细；
         market_summary 按 A股/港股/美股 汇总涨跌与成交额；
         key_findings 每条一句话，数字要对得上输入文件。字段含义见卡上的「JSON 形状」小节；
      ② artifacts/{date}/finance_report.md——先给结论与关键数字，再把
         t2_investment.md 里的 mermaid 图块**原样贴进**对应小节
         （正文至少 1 张图，验收按 mermaid 计数），最后注明数据期次与来源。
         只贴表格不贴图 = FAIL。
    # 上游两条互相独立（并行），汇总要等它们都完
    depends_on: [t1_stocks, t2_investment]
    inputs: ["artifacts/{date}/t1_stocks.csv", "artifacts/{date}/t2_investment.md"]
    outputs: ["artifacts/{date}/finance_summary.json", "artifacts/{date}/finance_report.md"]
    # 汇总类验收：不含 source_* 三条（本任务不检索、不产 sources.json）
    acceptance_ref: schemas/acceptance_finance_t3.yaml
    needs_web: false
    max_attempts: 3
    budget: {max_steps: 8, timeout_s: 420}
