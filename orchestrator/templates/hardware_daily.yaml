plan_template: hardware_daily
# 每日硬件跟踪：显卡/内存价格统计 + 硬件新闻（2026-10-05 新增，用户点名要）。
#
# 与 daily/housing/finance 共用 artifacts/{date}/ 目录，产物名全部独立
# （撞车已有门禁：tests/test_job_matrix.py::test_no_two_tasks_share_an_output_path）。
#
# 时刻：14:00。与 08:00 daily / 08:30 finance / 10:00 housing 错开，
# 避免两条链同时往 state.db 写（两个 run_daily 并行是没验证过的姿势）。
tasks:
  - id: t1_gpu_ram
    name: 价格统计
    complexity: complex
    key_questions:
      - "当前主流显卡（RTX 50 系 / RX 9000 系）各型号的到手价是多少？"
      - "DDR5 内存 16G/32G 套条的当前价格，与一周前相比涨跌多少？"
      - "近期价格是涨是跌？驱动因素（新品、产能、存储晶圆）是什么？"
      - "各型号的涨跌幅能不能追到公开来源与价格日期？"
    objective: >-
      检索并采集**当前**主流显卡与内存的真实公开价格，输出
      artifacts/{date}/t1_gpu_ram.csv：**至少 15 行、至少 6 列**，
      列须含：部件类型（显卡/内存）、型号、当前价格(CNY)、
      上期价格(CNY)、涨跌幅(%)、价格日期(YYYY-MM-DD)。
      每个数字必须能在你引用的原文里逐字找到；查不到的留空写"未查到"，
      **不许估算或凭记忆补**——显卡内存价格一天一变，凭记忆必错，
      而且错得从表面看不出来。同时交齐 sources.json / claims.json，
      优先引厂商官网、自营商品页与主流硬件媒体（A 类来源占比 ≥15%，
      达不到会卡验收——哪怕凑数也要有一两个官方页）。
      **另交一份 SKU 观测副产物** artifacts/{date}/t1_sku_observations.json
      （JSON 数组，≥10 行，形状见卡上「JSON 形状」小节）：每行一笔
      具体报价——identity_hint 写规范型号（series 如 "RTX 5060 Ti"，
      **渠道/成色/品牌不许塞进 series**，放 attrs_hint 的
      channel/condition/vendor）；attrs_hint 必含 condition/channel/
      source 三个分轨字段（source 一律写 "自采"）；low_price 为券后
      到手价、raw_price 为券前划线价；shop 写店铺名与平台；coupons
      列出 applicable 优惠券（名称/金额/门槛/到期日）。这份文件是
      时序数据库的进料口，形状不对整批作废。
    depends_on: []
    outputs: ["artifacts/{date}/t1_gpu_ram.csv",
              "artifacts/{date}/t1_sku_observations.json"]
    acceptance_ref: schemas/acceptance_hardware_t1.yaml
    needs_web: true
    freshness: recent
    max_attempts: 3
    budget: {max_steps: 12, timeout_s: 720}

  # t1b（2026-10-10 P0 新增）：确定性入库——把 t1 的观测副产物写进
  # data/sku.db。simple + needs_web=false：模型只负责触发命令，
  # 归一化/校验/隔离全部由 tools/sku_ingest 确定性完成（设计：
  # docs/design/sku-timeseries-db-v3.3.md §4 D6 方案 B）。
  # 验收读入库器自己落盘的 stats（模型转抄 stdout 不可靠）。
  # 注意：全链共用同构任务，改这里时同步审视其他链的 t1b（P2 接入时）。
  - id: t1b_sku_ingest
    name: 观测入库
    complexity: simple
    objective: >-
      在 orchestrator 目录下依次执行两条命令（顺序不可颠倒）：
      ① `python -X utf8 -m tools.sku_ingest --date {date} --domain hardware`
         ——把 artifacts/{date}/t1_sku_observations.json 校验入库，
         统计写到 artifacts/{date}/t1b_ingest_stats.json；
      ② `python -X utf8 -m tools.trend_calc --date {date}`
         ——基于库内数据生成趋势快照 artifacts/{date}/trend_snapshot.json
         （t4 依赖它，缺这步 t4 读到旧快照）。
      你只需：依次执行两条命令、确认退出码均为 0、读取 stats 文件核对
      ok+updated ≥ 10。若大量行进隔离区（quarantined 或 no_entity
      占比过半），检查 observations.json 的 hint 字段是否写错并在
      stats 旁写一份 t1b_ingest_review.md 说明原因；**不要手工改库**。
    depends_on: [t1_gpu_ram]
    inputs: ["artifacts/{date}/t1_sku_observations.json"]
    outputs: ["artifacts/{date}/t1b_ingest_stats.json"]
    acceptance_ref: schemas/acceptance_sku_ingest.yaml
    needs_web: false
    max_attempts: 3
    budget: {max_steps: 4, timeout_s: 300}

  - id: t2_hw_news
    name: 硬件新闻
    complexity: complex
    key_questions:
      - "近期 CPU / 显卡 / 内存存储 / 整机有哪些新品发布或价格调整？"
      - "上游产能、供应链、出口管制有什么影响硬件价格的动向？"
      - "内存与显卡的供需关系发生了什么变化？"
      - "哪些消息会直接影响当期装机成本？"
    objective: >-
      检索并汇总当期的硬件新闻：CPU、显卡、内存与存储、整机与外设，
      重点是**会影响价格与装机成本**的消息（新品、调价、产能、供应链、
      政策）。写入 artifacts/{date}/t2_hw_news.md，正文至少 800 字节、
      **至少 1 张 mermaid 图**（价格走势或型号间价格对比，数据逐字取自
      来源原文），每条新闻标注来源与发布时间，查不到发布时间的写
      "未查到"而不是估。
      **来源时效是硬验收**：sources.json 里每条被引用的来源，其
      published_at 必须落在卡尾「时效性要求」的窗口内（该窗口前的历史
      消息只允许在正文作背景一笔带过，**不得作为 source 引用**——
      验收按窗口逐条核对，超期来源太多会整单 FAIL）。检索时优先取
      窗口内的最新报道；拿不准发布时间的宁可少引也不要超期。
    depends_on: []
    outputs: ["artifacts/{date}/t2_hw_news.md"]
    # hardware 不套 finance/政策类口径：A 类来源在硬件消费品领域**不存在**
    # （NVIDIA/AMD/Intel 官方不是新闻源，B 级主流媒体 Tom's Hardware/AnandTech
    # /Reuters Tech 才是）。改用专门的 acceptance_hardware_t2.yaml，去掉
    # source_quality（仍留 traceable + freshness + 正文够长够图）。
    # freshness 60 天（不是默认 180）：硬件"产品发布→半年后"会跨过窗口。
    acceptance_ref: schemas/acceptance_hardware_t2.yaml
    needs_web: true
    freshness: recent
    max_attempts: 3
    budget: {max_steps: 10, timeout_s: 600}

  - id: t3_hw_report
    name: 生成日报
    complexity: complex
    objective: >-
      基于 artifacts/{date}/t1_gpu_ram.csv 与 artifacts/{date}/t2_hw_news.md 生成：
      ① artifacts/{date}/hardware_summary.json——顶层**必须**有这 5 个字段，
         缺一个或类型不对 = rule_2 schema_violation：
         {"date": "YYYY-MM-DD", "data_period": "YYYY-MM-DD",
          "rows": <整数行数>, "price_summary": <按部件类别的价格汇总>,
          "key_findings": ["结论1", "结论2"]}
         `rows` 是 t1_gpu_ram.csv 的**整数行数**（如 18）：不是数组、不放型号明细；
         price_summary 按显卡/内存汇总均价与周环比；
         key_findings 每条一句话，数字要对得上输入文件。字段含义见卡上的「JSON 形状」小节；
      ② artifacts/{date}/hardware_report.md——先给结论与关键价格，再把
         t2_hw_news.md 里的 mermaid 图块**原样贴进**对应小节
         （正文至少 1 张图，验收按 mermaid 计数），最后注明数据期次与来源。
         只贴表格不贴图 = FAIL。
    # 上游两条互相独立（并行），汇总要等它们都完
    depends_on: [t1_gpu_ram, t2_hw_news]
    inputs: ["artifacts/{date}/t1_gpu_ram.csv", "artifacts/{date}/t2_hw_news.md"]
    outputs: ["artifacts/{date}/hardware_summary.json", "artifacts/{date}/hardware_report.md"]
    # 汇总类验收：不含 source_* 三条（本任务不检索、不产 sources.json）
    acceptance_ref: schemas/acceptance_hardware_t3.yaml
    needs_web: false
    max_attempts: 3
    budget: {max_steps: 8, timeout_s: 420}

  # t4（2026-10-10 P1 新增）：趋势与推荐——读 trend_snapshot.json 写
  # 趋势榜 + 对比段 + 推荐，模型只解读不改数（设计铁律）。depends_on
  # t1b（必须有观测才能算快照），与 t2 并行（新闻互不依赖）。t3 引用
  # t4 的产物，所以 t4 必须在 t3 之前完成。
  - id: t4_hw_trend
    name: 趋势与推荐
    complexity: complex
    key_questions:
      - "本期哪些 SKU 在快速降价/涨价/企稳可以入手？"
      - "同型号不同品牌（vendor）或不同渠道（channel）的差价是多少？"
      - "基于历史观测的出期（label 与稳定性），给出当期 act_now/wait/
         probe_offer 等推荐动作。"
    objective: >-
      读 artifacts/{date}/trend_snapshot.json（由 tools.trend_calc 确定性
      生成），按以下结构产出：
      ① artifacts/{date}/hw_trend.md：分三段——
        · 趋势榜：每个基底的 last_price + label + d1_pct + slope_7
          （逐字引用快照数字，**不许修改**）
        · 控制变量对比：snap.contrasts 里各组 last_price 对比，
          给出一句话解读（取相同 / 不同品牌的差价意味着什么）
        · 推荐：按 action 枚举（act_now / wait / switch_to / probe_offer
          / lower_offer）给每个有显著变化的实体挂动作；稳定性 + 距
          30 期低点 + label 是挂动作的依据
      ② artifacts/{date}/hw_recommend.json——hw_recommend.json
      结构见卡上「JSON 形状」小节；decisions 数组每条带 entity /
      signal / evidence / action / note
      **注释：** 快照里的数字必须**原样引用**，不许修改、不许重算、
      不许「微调」——这是 v3.3 设计铁律：确定性指标不被模型改写。
      没有显著变化的实体段落直接用 webhook 直接连接前日报告
      （Q8 增量引用），或链接为 slug ../{前一日}/hw_trend.md#{entity_id}。
      验收：python_test 从 DB 重算 3 个抽样实体的 d1_pct/slope_7
      与快照一致（防模型改数）；有显著变化的实体必须配 mermaid 图
      （label 变化或 |d1_pct|>契约阈值，默认 1%）；当日全库无显著
      变化时报告至少保留 1 张全局汇总图（v3.3 M4）。
    depends_on: [t1b_sku_ingest]
    inputs: ["artifacts/{date}/trend_snapshot.json"]
    outputs: ["artifacts/{date}/hw_trend.md",
              "artifacts/{date}/hw_recommend.json"]
    acceptance_ref: schemas/acceptance_hw_t4.yaml
    needs_web: false
    max_attempts: 3
    budget: {max_steps: 8, timeout_s: 420}
